[workspace]
resolver = "2"
members = [
    "crates/launcher-core",
    "crates/launcher-auth",
    "crates/launcher-platform",
    "crates/launcher-cli",
    "Apps/desktop/src-tauri",
]

[workspace.package]
version = "0.10.0-rc.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["LingXiFox"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "process", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
base64 = "0.22"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
