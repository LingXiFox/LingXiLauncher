name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Build and package only; never create a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS ARM64
          - os: windows-2022
            label: Windows x64
          - os: ubuntu-22.04
            label: Linux x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2


      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: Apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Verify project-local Tauri CLI
        working-directory: Apps/desktop
        run: pnpm exec tauri --version

      - name: Build and package (validation)
        if: ${{ inputs.validation_only }}
        working-directory: Apps/desktop
        run: pnpm tauri build --ci

      - name: Build and package (release)
        if: ${{ !inputs.validation_only }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'LingXi Launcher ${{ github.ref_name }}'
          releaseBody: 'Rust + Tauri 2 release. See docs/rust-migration/MIGRATION-STATUS.md for verified scope.'
          releaseDraft: true
          prerelease: false
          args: --ci


      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lingxi-launcher-${{ matrix.os }}
          path: |
            target/release/bundle/**/*
            Apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 7
