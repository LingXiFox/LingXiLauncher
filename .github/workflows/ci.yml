name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    name: Build, test and package (Apple Silicon)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      SWIFT_DETERMINISTIC_HASHING: "1"
      NSUnbufferedIO: "YES"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Show toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version
          swift --version
          uname -m

      - name: Debug build
        run: swift build

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
          SUMMARY="$(grep -E 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$RUNNER_TEMP/swift-test.log" | tail -n 1)"
          test -n "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if grep -qi 'skipped' "$RUNNER_TEMP/swift-test.log"; then
            echo "XCTest reported skipped tests; inspect the full log." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "XCTest skips: 0 (no skip marker in the full log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Release CLI build
        run: swift build -c release --product lingxi

      - name: Release GUI build
        run: swift build -c release --product LingXiMac

      - name: Package app bundle (ad-hoc signed)
        run: Scripts/build-app.sh --release

      - name: Verify app bundle and ad-hoc signature
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/LingXiMac.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/LingXiMac"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/AppIcon.icns"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.lingxifox.LingXiLauncher"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")" = "LingXiMac"
          lipo -info "$APP/Contents/MacOS/LingXiMac" | tee "$RUNNER_TEMP/lipo.txt"
          grep -q 'arm64' "$RUNNER_TEMP/lipo.txt"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"
          echo "CI artifact is ad-hoc signed for testing only; it is not notarized or a release build." >> "$GITHUB_STEP_SUMMARY"

      - name: Archive app bundle
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "dist/LingXiMac.app" "dist/LingXiMac-${GITHUB_SHA}.zip"

      - name: Upload CI-only app artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingXiMac-ci-${{ github.sha }}
          path: dist/LingXiMac-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  windows-core:
    name: Core build and tests (Windows x86_64)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      SWIFT_DETERMINISTIC_HASHING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Swift for Windows
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1.2-release
          swift-build: 6.1.2-RELEASE

      - name: Show toolchain
        shell: pwsh
        run: |
          swift --version
          [System.Environment]::OSVersion.VersionString

      - name: Debug build Core and CLI
        shell: pwsh
        run: |
          swift build --product LauncherCore
          swift build --product LingXiCLIWindows

      - name: Unit tests
        shell: pwsh
        run: swift test
