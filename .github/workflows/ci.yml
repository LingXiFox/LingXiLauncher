name: CI

on:
  push:
    branches: [main, rewrite/rust]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: Rust fmt, clippy and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: Apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Frontend typecheck
        working-directory: Apps/desktop
        run: pnpm typecheck

      - name: Frontend build
        working-directory: Apps/desktop
        run: pnpm build

  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Apps/desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: Apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: Apps/desktop
        run: pnpm build

      - name: Build desktop binary
        run: cargo build --release -p lingxi-desktop --features custom-protocol

  cli-smoke:
    name: CLI smoke test
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p launcher-cli

      - name: Run offline CLI checks
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/lingxi-ci/minecraft"
          DATA="$RUNNER_TEMP/lingxi-ci"
          ./target/debug/lingxi --root "$ROOT" --data-root "$DATA" java list
          ./target/debug/lingxi --root "$ROOT" --data-root "$DATA" account list
          ./target/debug/lingxi --root "$ROOT" --data-root "$DATA" instance list
          ./target/debug/lingxi --root "$ROOT" --data-root "$DATA" --json doctor > /dev/null
